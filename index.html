<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d7a72">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3B Soluções Criativas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de busca fixa no topo, faixa de categorias, grade de cartões tipo etiqueta de bobina */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#1d2523; --muted:#5d6966; --line:#d5dcd9;
  --accent:#0d7a72; --accent-ink:#ffffff; --chip:#e2e8e6; --thumb-bg:#f6f8f7; --warn-bg:#f3e1b8; --warn-ink:#5c3d00;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --surface:#1d2523; --ink:#e6ecea; --muted:#9aa7a3; --line:#2f3a37;
  --accent:#3fb8ac; --accent-ink:#0b1514; --chip:#26302e; --thumb-bg:#232c2a; --warn-bg:#4a3a14; --warn-ink:#f3d9a0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --surface:#1d2523; --ink:#e6ecea; --muted:#9aa7a3; --line:#2f3a37;
  --accent:#3fb8ac; --accent-ink:#0b1514; --chip:#26302e; --thumb-bg:#232c2a; --warn-bg:#4a3a14; --warn-ink:#f3d9a0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 8px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,44px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
label.tog{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:13px;border:1px solid transparent;background:var(--chip);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] b{color:var(--accent-ink);opacity:.8}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding-block:14px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{aspect-ratio:4/3;background:var(--thumb-bg);display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .none{font-family:var(--mono);font-size:12px;color:var(--muted)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.name{font-weight:600;font-size:14.5px;line-height:1.3}
.cat{font-size:12px;color:var(--accent);font-weight:500}
.foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--chip);color:var(--muted)}
.orig{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.specs b{font-weight:600}
.obs{font-size:12.5px;color:var(--muted);line-height:1.35}
.price{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.price.alt{font-weight:500}
.cat .linha{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;letter-spacing:.02em;vertical-align:1px}
button.share,a.share{text-decoration:none;font:inherit;font-size:12px;font-weight:500;color:var(--accent);background:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer}
button.share:hover{border-color:var(--accent)}
.card.hl{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast input{display:block;width:100%;margin-top:8px;font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:0}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.thumb .tag.new.corner{position:absolute;top:0;right:0;z-index:1;border-radius:0 0 0 10px;padding:5px 11px 6px;font-size:12px;font-weight:600;letter-spacing:.03em;box-shadow:-1px 1px 4px rgba(0,0,0,.25)}
a.open{font-size:12px;color:var(--accent);text-decoration:none;font-weight:500;margin-left:auto}
a.open:hover{text-decoration:underline}
.empty{padding:48px 0;color:var(--muted);text-align:center}
@media (max-width:480px){.dk b{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.orig{display:none}}
.thumb img{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,12,11,.97);display:flex;flex-direction:column;touch-action:none}
.lb[hidden]{display:none}
.thumb{position:relative}.nmid{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-family:var(--mono);padding:3px 7px;border-radius:6px;pointer-events:none}
.lb-count{color:#9aa7a3;font-size:13px;font-family:var(--mono);margin-left:auto}.lb-count:empty{display:none}.lb-title{flex:1}
.lb .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:30px;z-index:2;background:rgba(0,0,0,.45)}.lb .lb-nav.prev{left:8px}.lb .lb-nav.next{right:8px}.lb .lb-nav[hidden]{display:none}
.lb-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.lb button[hidden]{display:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:4px 0 8px}
.mt{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:var(--thumb-bg)}.mt.capa{outline:3px solid var(--accent);outline-offset:-1px}
.mt img,.mt video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.mt .mb{display:flex;flex-wrap:wrap;gap:2px 8px;justify-content:space-between;padding:4px 8px;font-size:12px}
.mt .tc{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:2px 7px;border-radius:6px}.mt .tv{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px}
.upl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lb-top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));color:#e6ecea}
.lb-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb button{font:inherit;font-size:18px;line-height:1;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;flex:none}
.lb button:hover{background:rgba(255,255,255,.16)}
.lb-stage{flex:1;position:relative;overflow:hidden;cursor:grab}
.lb-stage.drag{cursor:grabbing}
.lb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-drag:none}
.lb-note:empty{display:none}
.lb-note{text-align:center;color:#9aa7a3;font-size:12px;padding:6px 12px calc(10px + env(safe-area-inset-bottom,0px))}

.ctools{display:flex;gap:10px;align-items:center;padding-left:10px;border-left:2px solid var(--accent)}
.ctools[hidden]{display:none}
.ctools button{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ficha{border-style:dashed}
button.ficha.has{border-style:solid;background:var(--chip);color:var(--ink);font-weight:600}
.cdlg{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cdlg::backdrop{background:rgba(10,14,13,.55)}
.cdlg-in{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.cdlg-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.cdlg-hd h2{flex:1;margin:0;font-family:var(--display);font-size:20px;line-height:1.2}
.cx{font:inherit;font-size:16px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.cdlg-body{padding:12px 18px 18px;overflow:auto}
.cdlg h3{font-size:14px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cdlg h3 .cnt{font-family:var(--mono);font-weight:400}
.cform{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.cdlg .row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.cdlg .row[hidden],.cdlg p[hidden]{display:none}
.cdlg label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1 1 150px;min-width:0}
.cdlg label.full{margin-top:8px}
.cdlg input,.cdlg select,.cdlg textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.cdlg .btns{align-items:center;margin-top:10px}
.cdlg .btns button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cdlg .btns button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cdlg .msg{font-size:13px;color:var(--muted)}
.cdlg .muted{color:var(--muted);font-size:13px;margin:6px 0}
.warnbox{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.ctab{width:100%;border-collapse:collapse;font-size:14px}
.ctab th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
.ctab td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctab td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ctab td.act{white-space:nowrap;text-align:right}
.ctab.fic select{min-width:160px}
.lnk{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 6px}
.lnk.del{color:#b4412f}
.qwrap{display:flex;align-items:center;gap:6px}.qwrap input{width:90px}.qwrap .un{font-size:12px;color:var(--muted)}
.tm{display:flex;align-items:center;gap:6px;color:var(--ink)}.tm input{width:64px}
.resumo{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.tot b{font-variant-numeric:tabular-nums}
.tot.ok b{color:var(--accent)}.tot.bad b{color:#b4412f}
@media (max-width:560px){.ctab.fic select{min-width:0}.ctab:not(.ptab) th:nth-child(3),.ctab:not(.ptab) td.num{display:none}}
/* ===== Gestão: layout com menu lateral ===== */
body.gestao{margin:0}
.gshell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.gside{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 24px;display:flex;flex-direction:column;gap:6px}
.gbrand{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;padding:0 8px 10px}
.gbrand span{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:4px}
.gnav{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.gnav button{font:inherit;font-size:15px;font-weight:500;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:none;color:var(--ink);cursor:pointer}
.gnav button:hover{background:var(--chip)}
.gnav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.gcats-h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px 2px}
.gestao .gside .chips{flex-direction:column;overflow:visible;padding:0;gap:1px}
.gestao .gside .chip{display:flex;justify-content:space-between;gap:8px;text-align:left;white-space:normal;background:none;border-radius:8px;padding:6px 10px}
.gestao .gside .chip:hover{background:var(--chip)}
.gestao .gside .chip[aria-pressed="true"]{background:var(--chip);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.gestao .gside .chip[aria-pressed="true"] b{color:var(--muted)}
.gestao .wrap{max-width:none}
.gview{padding-top:28px;padding-bottom:48px}
.gview h1{margin-bottom:0}
.gview .vbody{margin-top:16px}
.gview .vbody .cform{background:var(--surface)}
.gview h3{font-size:14px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.gview .cform h3{margin-top:0}
.gview .row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.gview .row[hidden],.gview p[hidden]{display:none}
.gview label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1 1 150px;min-width:0}
.gview input,.gview select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.gview .btns{align-items:center;margin-top:12px}
.gview button.pri,.gview .btns button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.gview button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.gview .btns .lnk{border:0;background:none}
.gview .msg{font-size:13px;color:var(--muted)}
.gview .muted{color:var(--muted);font-size:14px}
.gview .ctab{background:var(--surface)}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ptools .psearch{flex:1 1 260px}
.gview .search input{padding-left:40px}
.ptools select{width:auto}
.pstf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}
.pstf-l{font-size:13px;color:var(--muted);margin-right:2px}
.pstf-h{font-size:12px;color:var(--muted);margin-left:6px}
.pstb{font:inherit;font-size:13px;font-weight:500;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pstb b{font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:3px}
.pstb.inc{font-weight:700;box-shadow:inset 0 0 0 2px currentColor}
.pstb.st-0.inc{background:var(--chip)}
.pstb.st-1.inc{background:#dbe8f7;color:#1d3f66}
.pstb.st-2.inc{background:var(--warn-bg);color:var(--warn-ink)}
.pstb.st-3.inc{background:#d9efe2;color:#1f5a37}
.pstb.st-4.inc{background:var(--accent);color:var(--accent-ink)}
.pstb.inc b{color:inherit;opacity:.75}
.pstb.exc{background:var(--surface)!important;color:var(--muted)!important;border-style:dashed;text-decoration:line-through}
.pform{margin-bottom:18px}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.pgrid label{flex:none}
.pgrid .c6{grid-column:1/-1}
.gview textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.ptab td.pobs{white-space:normal;min-width:180px;max-width:280px;font-size:13px;color:var(--muted)}
.pgrid .c1{grid-column:span 1}.pgrid .c2{grid-column:span 2}.pgrid .c3{grid-column:span 3}.pgrid .c4{grid-column:span 2}
.pgrid label:has(#pProd){position:relative}
.pbusca{display:flex;gap:6px}.pbusca input{flex:1}
.pbusca button{font:inherit;font-size:13px;padding:0 12px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer;font-weight:600}
.pres{position:absolute;left:0;right:0;top:100%;z-index:8;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;max-height:340px;overflow:auto;display:flex;flex-direction:column}
.pres[hidden]{display:none}
.pres button{display:flex;align-items:center;gap:10px;font:inherit;font-size:14px;color:var(--ink);text-align:left;background:none;border:0;border-radius:7px;padding:5px 8px;cursor:pointer}
.pres button:hover,.pres button:focus-visible{background:var(--chip)}
.pres img,.pres i{width:48px;height:36px;object-fit:cover;border-radius:5px;flex:none;background:var(--thumb-bg)}
.pres .none{padding:8px;color:var(--muted);font-size:13px}
#pDesc{background:var(--bg)}
.pcalc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.pcalc div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.pcalc span{font-size:12px;color:var(--muted)}
.pcalc b{font-size:17px;font-variant-numeric:tabular-nums}
.pcalc .ok b{color:var(--accent)}.pcalc .bad b{color:#b4412f}
.ptab-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ptab{min-width:1460px}
.ptab th,.ptab td{white-space:nowrap}
.ptab td.prod{white-space:normal;min-width:220px}
.ptab .r{text-align:right}
.ptab td.ok{color:var(--accent)}.ptab td.bad{color:#b4412f}
.ptab td small{color:var(--muted)}
.ptab tr.sel td{background:var(--chip)}
.ptab tfoot td{font-weight:600;border-bottom:0;color:var(--muted)}
@media (max-width:760px){
  .ptab-wrap{overflow:visible;border:0;background:none;border-radius:0}
  .ptab{min-width:0;width:100%}
  .ptab thead{display:none}
  .ptab,.ptab tbody,.ptab tfoot{display:block}

var COST={db:null,ready:false,insumos:{},fichas:{},pedidos:{}};
function fmtR(v){return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}).replace(/\u00a0/g," ")}
function precosDe(d){var f=(COST&&COST.on&&COST.fichas)?COST.fichas["m"+d.id]:null;
  if(f&&(f.preco>0||(f.alt||[]).some(a=>a&&a.preco>0))){
    return {v:f.preco>0?(f.precoDesc?f.precoDesc+": ":"")+fmtR(f.preco):d.v,va:(f.alt||[]).filter(a=>a&&a.preco>0).map(a=>(a.desc?a.desc+": ":"")+fmtR(a.preco))}}
  return {v:d.v,va:d.va||[]}}
function extraDe(d){const f=(COST&&COST.on&&COST.fichas)?COST.fichas["m"+d.id]:null;const src=f||{descricao:d.dsc,midias:d.md,capa:d.capa};
  const md=Array.isArray(src.midias)?src.midias.filter(m=>m&&m.u):[];const so=semOrig(src);
  return{orig:d.t!==undefined&&!so,desc:src.descricao!=null?src.descricao:d.ob,md,capa:(src.capa&&md.find(m=>m.u===src.capa))||null}}
function semOrig(f){return!!f&&Array.isArray(f.midias)&&f.midias.some(m=>m&&m.tipo==="semorig")}
function hasFoto(d){const X=extraDe(d);return X.orig||X.md.some(m=>m.tipo==="img")}
function precoPrincipal(d){var f=COST.fichas["m"+d.id];if(f&&f.preco>0)return f.preco;return precoVenda(d)}
const brl=v=>(isFinite(v)?v:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=s=>{if(typeof s==="number")return isFinite(s)?s:0;let t=String(s??"").trim();if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");const x=parseFloat(t);return isFinite(x)?x:0};
const fmtNum=v=>String(v??"").replace(".",",");
function precoVenda(d){if(!d.v)return null;const m=String(d.v).match(/(\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:,\d+)?)(?!.*\d)/);return m?num(m[1]):null}
function insumoLabel(i){if(!i)return"(removido)";if(i.tipo==="filamento")return`${i.material||""} ${i.cor||""} – ${i.marca||""}`.replace(/\s+/g," ").trim();return i.tipo==="acessorio"&&i.marca&&i.marca!=="Genérica"?`${i.nome||""} – ${i.marca}`:(i.nome||"(sem nome)")}
function calcFicha(f){
  const out={linhas:[],total:0};if(!f)return out;
  for(const it of f.itens||[]){const ins=COST.insumos[it.insumo];const q=num(it.qtd);let v=0,un="";
    if(ins){if(ins.tipo==="filamento"){v=q/1000*num(ins.precoKg);un="g"}else{v=q*num(ins.preco);un=ins.unidade||"un"}}
    out.linhas.push({nome:insumoLabel(ins),q,un,v});out.total+=v}
  const maq=COST.insumos[f.maquina];const h=(num(f.minutos))/60;
  if(maq&&h){const v=h*num(maq.precoHora);out.linhas.push({nome:`${maq.nome||"Máquina"} (${fmtTempo(f.minutos)})`,q:null,un:"",v});out.total+=v}
  if(num(f.extra)){out.linhas.push({nome:"Outros custos",q:null,un:"",v:num(f.extra)});out.total+=num(f.extra)}

/* ----- Dashboard de vendas (venda = data do pedido) ----- */
let dashPer="ano",dashGr="mes";
try{dashPer=localStorage.getItem("cat3d_dper")||"ano";dashGr=localStorage.getItem("cat3d_dgr")||"mes"}catch(e){}
const DPER={mes:"Este mês",mesant:"Mês passado","30d":"Últimos 30 dias","90d":"Últimos 90 dias",ano:"Este ano",tudo:"Tudo"};
const isoD=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const pD=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function dashRange(){const t=new Date();t.setHours(0,0,0,0);let a,b=new Date(t);
  if(dashPer==="mes")a=new Date(t.getFullYear(),t.getMonth(),1);
  else if(dashPer==="mesant"){a=new Date(t.getFullYear(),t.getMonth()-1,1);b=new Date(t.getFullYear(),t.getMonth(),0)}
  else if(dashPer==="30d"){a=new Date(t);a.setDate(a.getDate()-29)}
  else if(dashPer==="90d"){a=new Date(t);a.setDate(a.getDate()-89)}
  else if(dashPer==="ano")a=new Date(t.getFullYear(),0,1);
  else{const ds=Object.values(COST.pedidos).map(p=>p.dataPedido).filter(Boolean).sort();a=ds.length?pD(ds[0]):new Date(t);const z=ds.length?pD(ds[ds.length-1]):t;if(z>b)b=z}
  return{a,b}}
function bucketKey(d){if(dashGr==="dia")return isoD(d);if(dashGr==="mes")return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return isoD(x)}
function bucketLabel(k){if(dashGr==="mes"){const[y,m]=k.split("-");return`${MES[+m-1]}/${y.slice(2)}`}const d=pD(k);return`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`}
function bucketTitle(k){if(dashGr==="mes"){const[y,m]=k.split("-");return`${MES[+m-1]} de ${y}`}const d=pD(k);if(dashGr==="dia")return d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"});const e=new Date(d);e.setDate(e.getDate()+6);return`Semana de ${fmtData(isoD(d))} a ${fmtData(isoD(e))}`}
function buckets(a,b){const ks=[],seen=new Set();const d=new Date(a);while(d<=b){const k=bucketKey(d);if(!seen.has(k)){seen.add(k);ks.push(k)}d.setDate(d.getDate()+1)}return ks}
function renderDash(){
  const b=$("viewDash").querySelector(".vbody");
  if(!COST.ready){b.innerHTML=noDbMsg();return}
  const {a,b:z}=dashRange();const A=isoD(a),Z=isoD(z);
  const ps=Object.values(COST.pedidos).filter(p=>p.dataPedido&&p.dataPedido>=A&&p.dataPedido<=Z).map(p=>({...p,...calcPed(p)}));
  const sum=(l,k)=>l.reduce((s,x)=>s+num(x[k]),0);
  const vend=sum(ps,"valorPedido"),marg=sum(ps,"margem"),cust=sum(ps,"custoTotal"),qtd=sum(ps,"qtd");
  const aReceber=ps.filter(p=>p.status!=="Pago").reduce((s,p)=>s+p.valorPedido,0);
  const emAberto=ps.filter(p=>p.status==="Pendente"||p.status==="Produzindo"||p.status==="Aguardando entrega").length;
  const clientes=new Set(ps.map(p=>(p.cliente||"").trim().toLowerCase())).size;
  // série temporal
  const ks=buckets(a,z);const ser=Object.fromEntries(ks.map(k=>[k,{v:0,m:0,n:0}]));

px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}\n.brand-txt{display:flex;flex-direction:column;line-height:1.1}\n.brand-txt small{font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted);letter-spacing:0;margin-top:4px}\n.tipbox{display:inline-block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;color:var(--ink);font-size:15px;margin-top:6px}\n.pub .meta #count:empty{display:none}\n.cpk{position:relative;flex:0 1 260px;min-width:200px}\n.cpk-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}\n.cpk-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}\n.cpk-pop{position:absolute;z-index:20;top:calc(100% + 6px);left:0;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:8px;display:flex;flex-direction:column;gap:6px}\n.cpk-pop[hidden]{display:none}\n.cpk-q{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}\n.cpk-list{max-height:min(36vh,280px);overflow:auto;display:flex;flex-direction:column;overscroll-behavior:contain}\n.cpk-it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;font-size:14.5px}\n.cpk-it:hover{background:var(--chip)}\n.cpk-it input{width:18px;height:18px;accent-color:var(--accent);flex:none}\n.cpk-it span{flex:1}\n.cpk-it b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted)}\n.cpk-ft{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px}\n.cpk-ft button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}\n.cpk-ft .cpk-ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}\n.cpk-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}\n.cpk-tags:empty{display:none}\n.cpk-tag{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}\nbutton.quote{align-self:flex-start;font:inherit;font-size:13px;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}\nbutton.quote:hover{filter:brightness(1.08)}\n@media (max-width:480px){.brand-mark{width:44px;height:44px;font-size:20px;border-radius:11px}.brand-txt small{font-size:13px}.cpk{flex:1 1 100%}}\n<\/style>\n\n<header class=\"wrap\">\n  <h1>Catálogo de Modelos 3D<\/h1>\n  <p class=\"sub\" id=\"sub\"><\/p>\n<\/header>\n<div class=\"bar\"><div class=\"wrap\">\n  <div class=\"controls\">\n    <div class=\"search\">\n      <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-3.5-3.5\"/><\/svg>\n      <input id=\"q\" type=\"search\" placeholder=\"Buscar: gato, suporte, chaveiro… ou código #123\" aria-label=\"Buscar modelos\" autocomplete=\"off\">\n    <\/div>\n    <select id=\"ord\" aria-label=\"Ordenar\">\n      <option value=\"az\">Nome A–Z<\/option>\n      <option value=\"cat\">Por categoria<\/option>\n    <\/select>\n    <label class=\"tog\"><input id=\"foto\" type=\"checkbox\"> Só com foto<\/label>\n    <label class=\"tog\"><input id=\"preco\" type=\"checkbox\"> Só com preço<\/label>\n    <label class=\"tog\"><input id=\"linha\" type=\"checkbox\"> Produtos de linha<\/label>\n    <label class=\"tog\"><input id=\"nov\" type=\"checkbox\"> Só novidades<\/label>\n  <\/div>\n  <div class=\"chips\" id=\"chips\" role=\"toolbar\" aria-label=\"Categorias\"><\/div>\n<\/div><\/div>\n<main class=\"wrap\">\n  <div class=\"meta\"><span id=\"count\"><\/span><span id=\"hint\"><\/span><\/div>\n  <div class=\"grid\" id=\"grid\"><\/div>\n  <div class=\"empty\" id=\"empty\" hidden>Nenhum modelo encontrado. Tente outra palavra ou limpe o filtro de categoria.<\/div>\n<\/main>\n<div class=\"lb\" id=\"lb\" hidden role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"lbt\">\n  <div class=\"lb-top\">\n    <span class=\"lb-title\" id=\"lbt\"><\/span>\n    <button type=\"button\" id=\"lbo\" aria-label=\"Diminuir zoom\">−<\/button>\n    <button type=\"button\" id=\"lbi\" aria-label=\"Aumentar zoom\">+<\/button>\n    <button type=\"button\" id=\"lbx\" aria-label=\"Fechar\">✕<\/button>\n  <\/div>\n  <div class=\"lb-stage\" id=\"lbs\"><img id=\"lbimg\" alt=\"\"><\/div>\n  <div class=\"lb-note\" id=\"lbn\"><\/div>\n<\/div>\n\n",PAGE_POST="\n";
